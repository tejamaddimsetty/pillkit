{% extends "auth_base.html" %}
{% block title %}Sign in · Pill Kit{% endblock %}
{% block form %}
<h1>Welcome back</h1>
<p class="muted">Sign in to manage your apps, items and licence.</p>
<form method="post" class="auth-fields">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Email<input name="email" type="email" autocomplete="email" required autofocus placeholder="you@company.com"></label>
  <label>Password
    <span class="pw"><input name="password" id="pw" type="password" autocomplete="current-password" required><button type="button" class="reveal" data-reveal="pw">Show</button></span>
  </label>
  <button class="btn block">Sign in</button>
</form>
<p class="muted">New to Pill Kit? <a href="{{ url_for('apply') }}">Apply for a developer licence</a></p>
{% endblock %}
