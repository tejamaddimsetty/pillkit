name: ci

on:
  push:
  pull_request:

jobs:
  host:
    name: host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p pillkit-core
      - run: cargo build -p pillkit-host --release
        env:
          # Set this repository secret to the production server's public key
          # (GET /v1/public-key). Release hosts trust only this key.
          PILLKIT_PUBLIC_KEY: ${{ secrets.PILLKIT_PUBLIC_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: pillkit-host-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/pillkit-host
            target/release/pillkit-host.exe
          if-no-files-found: ignore
      # Dev build: optimised, but accepts a local test server's key.
      - run: cargo build -p pillkit-host --release --features dev-keys
      - uses: actions/upload-artifact@v4
        with:
          name: pillkit-host-dev-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/pillkit-host
            target/release/pillkit-host.exe
          if-no-files-found: ignore

  # Runs the real host on Windows and talks to it like an app does.
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build -p pillkit-host --release --features dev-keys
      - run: python -m pip install -r server/requirements.txt
      - name: Start server, start host, register an app
        shell: pwsh
        run: |
          Set-Location server
          $seed = python dev_seed.py
          $appId = ($seed | Select-String "APP_ID=(.*)").Matches[0].Groups[1].Value.Trim()
          $key = ($seed | Select-String "KEY=(pk_.*)").Matches[0].Groups[1].Value.Trim()
          Start-Process python -ArgumentList "app.py" -WindowStyle Hidden
          for ($i = 0; $i -lt 60; $i++) { try { Invoke-RestMethod http://127.0.0.1:5050/healthz | Out-Null; break } catch { Start-Sleep -Milliseconds 500 } }
          $env:PILLKIT_PUBLIC_KEY = (Invoke-RestMethod http://127.0.0.1:5050/v1/public-key).key
          Set-Location ..
          Start-Process target\release\pillkit-host.exe -ArgumentList "run" -WindowStyle Hidden
          python scripts\smoke_test.py $appId $key http://127.0.0.1:5050
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Idle cost: CPU time used by the host over 30 s, as % of one core.
          $p = Get-Process pillkit-host
          $c0 = $p.TotalProcessorTime.TotalSeconds
          Start-Sleep -Seconds 30
          $p.Refresh()
          $pct = [math]::Round(($p.TotalProcessorTime.TotalSeconds - $c0) / 30 * 100, 2)
          $mb = [math]::Round($p.WorkingSet64 / 1MB, 1)
          Write-Host "idle cost: $pct% of one core, $mb MB memory"
          if ($pct -gt 1.0) { Write-Host "FAIL: idle CPU above 1%"; exit 1 }

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
