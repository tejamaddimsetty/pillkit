name: release

# Push a tag like v0.3.0 to build pillkit-host for each platform and attach
# to the GitHub Release: the raw binaries, and the npm packages (`pillkit` and
# pillkit-host-<os>-<arch>) as .tgz files. Publishing to npm is done by hand
# from the maintainer's account: npm publish <each .tgz>.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, npm: win32-x64, asset: windows-x64, ext: ".exe" }
          - { os: macos-latest, target: aarch64-apple-darwin, npm: darwin-arm64, asset: macos-arm64, ext: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, npm: darwin-x64, asset: macos-x64, ext: "" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, npm: linux-x64, asset: linux-x64, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          cargo build -p pillkit-host --release --target ${{ matrix.target }}
          mkdir -p dist npm-bin
          BIN=target/${{ matrix.target }}/release/pillkit-host${{ matrix.ext }}
          cp "$BIN" dist/pillkit-host-${{ matrix.asset }}${{ matrix.ext }}
          cp "$BIN" dist/pillkit-preview-${{ matrix.asset }}${{ matrix.ext }}
          cp "$BIN" npm-bin/pillkit-host${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.npm }}
          path: npm-bin/
      - name: Attach to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Install the SDK: \`npm install pillkit\`. Just want to see the pill? Download pillkit-preview-* for your OS and double-click it. See CHANGELOG.md." || true
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  npm:
    needs: host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Pack the npm packages and attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/set-npm-version.mjs "$VERSION"
          mkdir -p tarballs
          for p in darwin-arm64 darwin-x64 win32-x64 linux-x64; do
            mkdir -p npm/host-$p/bin
            cp artifacts/npm-$p/* npm/host-$p/bin/
            chmod +x npm/host-$p/bin/* || true
            (cd npm/host-$p && npm pack --pack-destination ../../tarballs)
          done
          (cd sdks/node && npm pack --pack-destination ../../tarballs)
          ls -la tarballs
          # Installable before (or without) the npm registry:
          #   npm install <release URL>/pillkit-X.tgz <release URL>/pillkit-host-<os>-<arch>-X.tgz
          gh release upload "$GITHUB_REF_NAME" tarballs/* --clobber
