name: release

# Push a tag like v0.1.1 to publish host binaries on a GitHub Release.
# Release assets download without signing in, which is what install.cmd and
# install.sh rely on.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, ext: ".exe" }
          - { os: macos-latest, name: macos-arm64, ext: "" }
          - { os: ubuntu-latest, name: linux-x64, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release and dev hosts
        shell: bash
        env:
          PILLKIT_PUBLIC_KEY: ${{ secrets.PILLKIT_PUBLIC_KEY }}
        run: |
          mkdir dist
          cargo build -p pillkit-host --release
          cp target/release/pillkit-host${{ matrix.ext }} dist/pillkit-host-${{ matrix.name }}${{ matrix.ext }}
          # Same release binary, preview name: double-click shows sample pills, no setup.
          cp target/release/pillkit-host${{ matrix.ext }} dist/pillkit-preview-${{ matrix.name }}${{ matrix.ext }}
          # Test build: optimised too, but trusts a local server's key.
          cargo build -p pillkit-host --release --features dev-keys
          cp target/release/pillkit-host${{ matrix.ext }} dist/pillkit-host-dev-${{ matrix.name }}${{ matrix.ext }}
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md. Just want to see the pill? Download pillkit-preview-* for your OS and double-click it. Full local setup: install.cmd / install.sh fetch the pillkit-host-dev-* file for you." || true
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
