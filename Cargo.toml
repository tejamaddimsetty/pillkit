[workspace]
resolver = "2"
members = ["crates/pillkit-core", "crates/pillkit-host"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tejamaddimsetty/pillkit"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = "2.1"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
fontdue = "0.9"
